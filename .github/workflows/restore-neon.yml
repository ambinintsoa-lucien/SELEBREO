name: Restore SELEBREO database to Neon

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Vérifier le backup
        run: |
          ls -lh backend/selebreo_backup.dump

      - name: Restaurer la base Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_restore \
            --dbname="$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            backend/selebreo_backup.dump